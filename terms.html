      return (
        <>
          <CCNavbar onContact={() => setContactOpen(true)} />
          <CCLegal title="Terms of service" updated="May 7, 2026" sections={sections} />

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  <script src="animate.js"></script>
