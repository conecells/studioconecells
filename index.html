<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conecells — We build brand that are impossible to unsee</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [contactOpen, setContactOpen] = useState(false);
      const openContact = () => setContactOpen(true);
      return (
        <>
          <CCNavbar onContact={openContact} current="Work" />
          <CCHero onCta={openContact} />
          <CCLogoWall />
          <CCFeatures />
          <CCBenefits />
          <CCTestimonial />
          <CCFaq onContact={openContact} />
          <CCCta onContact={openContact} />
          <CCFooter />
          <CCContactModal open={contactOpen} onClose={() => setContactOpen(false)} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="animate.js"></script>
</body>
</html>
