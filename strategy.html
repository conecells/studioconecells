<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy — Conecells</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const services = [
      { icon: "search", title: "Brand strategy",
        body: "Positioning, narrative, and a brand platform that tells a single coherent story across every surface." },
      { icon: "group", title: "Audience research",
        body: "Customer interviews, surveys, and segmentation. Real evidence to ground every downstream decision." },
      { icon: "trending_up", title: "Market positioning",
        body: "Competitive landscape, category map, and a sharper read on where you actually win." },
      { icon: "edit", title: "Messaging & copy",
        body: "Hierarchies, taglines, and page-level copy. Written to be said out loud, not just skimmed." },
      { icon: "layers", title: "Naming",
        body: "Companies, products, features. Names that survive trademark, search, and a five-year roadmap." },
      { icon: "palette", title: "Workshops",
        body: "Two-day sessions with your leadership team. Ends with shared language and a written brief." },
    ];
    const steps = [
      { title: "Listen",   body: "Stakeholder interviews and an honest read of where the brand actually stands today." },
      { title: "Map",      body: "Competitive landscape, audience segments, and the white space worth claiming." },
      { title: "Position", body: "A short, written platform: who you are, who you serve, and why it matters." },
      { title: "Activate", body: "We translate strategy into copy, design, and the artifacts your team will actually use." },
    ];
    const faqs = [
      { q: "Do we need a strategy engagement before design?",
        a: "Not always. If you have a clear positioning doc we'll work from yours. If something feels off, we'll flag it before we start designing." },
      { q: "How is strategy work priced?",
        a: "Flat fee per phase. Discovery and positioning are typically a four-week engagement; ongoing strategic support is monthly." },
      { q: "What's the deliverable?",
        a: "A short, written brand platform and messaging doc — the kind your team will actually open, not a 90-slide deck." },
      { q: "Can you work with our internal strategy team?",
        a: "Often the best engagements look like that. We bring an outside read; your team brings context we'll never have." },
    ];
    function App() {
      const [contactOpen, setContactOpen] = useState(false);
      const open = () => setContactOpen(true);
      return (
        <>
          <CCNavbar onContact={open} current="Strategy" />
          <CCPageHero
            eyebrow="Strategy"
            title="Sharper thinking before sharper pixels."
            body="Most design problems are positioning problems wearing a costume. We help you figure out what you're really selling, to whom, and why it matters — then we put it on the page."
          />
          <CCServiceGrid
            eyebrow="What we do"
            title="Strategy work that ends in something you can use."
            items={services}
            scheme="scheme-1"
          />
          <CCBenefits />
          <CCProcess
            eyebrow="Process"
            title="Four phases. Honest scope. Real deliverables."
            steps={steps}
            scheme="scheme-2"
          />
          <CCTestimonial />
          <CCFaq items={faqs} onContact={open} />
          <CCCta onContact={open} />
          <CCFooter />
          <CCContactModal open={contactOpen} onClose={() => setContactOpen(false)} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="animate.js"></script>
</body>
</html>
